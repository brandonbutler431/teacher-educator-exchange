<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community harness — spaces and threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap">
<link rel="stylesheet" href="community.css">
<style>
  body {
    margin: 0; background: #f7f5f1; color: #16233a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 28px 80px; }
  .note {
    border: 1px dashed #cfd8e6; background: #fff; border-radius: 6px;
    padding: 14px 16px; font-size: 13.5px; color: #5b6879; margin-bottom: 28px;
  }
  h1 {
    margin: 0 0 6px; font-family: "Source Serif 4", Georgia, serif;
    font-size: 34px; font-weight: 700; color: #11265c;
  }
  .sub { margin: 0 0 26px; color: #5b6879; font-size: 16px; }
  .bar { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Community</h1>
    <p class="sub">Conversations among teacher educators, in three spaces.</p>
    <div class="note">Local harness only — not part of the Webflow site. It loads the same
      <code>community.js</code> against the live Supabase project, so signing in here signs you
      in for real. <code>?id=</code> in the address switches this page to the thread view.</div>
    <div class="bar">
      <button class="texc-btn" type="button" data-tex="join">Join</button>
      <button class="texc-btn-2" type="button" data-tex="signin">Sign in</button>
      <button class="texc-btn-2" type="button" data-tex="signout">Sign out</button>
      <button class="texc-btn-2" type="button" data-tex="account">Profile</button>
    </div>
    <tex-spaces></tex-spaces>
  </div>
  <script type="module" src="community.js"></script>
</body>
</html>
